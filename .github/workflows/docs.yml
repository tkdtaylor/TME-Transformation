name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_config.outcome == 'success' }}
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: python3 -m pip install --upgrade pip && pip install "mkdocs-material>=9.5,<10"

      - name: Stage MkDocs docs source
        run: python3 scripts/build_docs_src.py

      - name: Run repository integrity validator
        run: python3 scripts/validate_repo.py --check-nav mkdocs.yml

      - name: Build strict MkDocs site
        run: mkdocs build --strict

      - name: Configure GitHub Pages
        id: pages_config
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages_config.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
